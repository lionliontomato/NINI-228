<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>念念的歌單</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>

<!-- 背景 CSS -->
<style>
body {
  background:
    radial-gradient(circle at 14% 12%, rgba(255,255,255,.65), transparent 20%),
    radial-gradient(circle at 86% 16%, rgba(255,198,216,.45), transparent 24%),
    radial-gradient(circle at 18% 78%, rgba(255,170,198,.28), transparent 32%),
    radial-gradient(circle at 86% 82%, rgba(232,190,210,.24), transparent 30%),
    linear-gradient(135deg,#fff1f6 0%,#ffdce9 38%,#ffcfe0 68%,#fff5f8 100%) !important;
}
.bg-art,
.bg-blossom,
.bg-clouds,
.bg-moon,
.bg-window,
.bg-ribbon,
.bg-fan{
  position: fixed;
  pointer-events: none;
  z-index: 0;
}
.bg-art{
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.24) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
  background-size: 46px 46px;
  opacity: .58;
}
.bg-clouds{
  inset:0;
  opacity:.62;
  background:
    radial-gradient(ellipse at 16% 42%, transparent 55%, rgba(214,135,165,.18) 56%, transparent 58%),
    radial-gradient(ellipse at 86% 34%, transparent 55%, rgba(214,135,165,.15) 56%, transparent 58%),
    radial-gradient(ellipse at 68% 74%, transparent 55%, rgba(214,135,165,.13) 56%, transparent 58%);
}
.bg-blossom{
  left: -18px;
  top: 36px;
  width: 350px;
  height: 250px;
  opacity: .75;
  transform: rotate(-13deg);
}
.bg-blossom::before{
  content:"";
  position:absolute;
  left:12px;
  top:118px;
  width:330px;
  height:3px;
  background: rgba(173,92,120,.24);
  transform: rotate(-18deg);
  transform-origin: left center;
}
.bg-blossom span{
  position:absolute;
  width:25px;
  height:25px;
  border-radius:58% 42% 60% 40%;
  background: rgba(255,238,244,.9);
  border:1px solid rgba(210,125,155,.20);
  box-shadow:0 0 0 7px rgba(255,166,194,.13);
}
.bg-blossom span:nth-child(1){left:44px;top:96px}
.bg-blossom span:nth-child(2){left:92px;top:70px}
.bg-blossom span:nth-child(3){left:142px;top:54px}
.bg-blossom span:nth-child(4){left:192px;top:36px}
.bg-blossom span:nth-child(5){left:246px;top:22px}
.bg-blossom span:nth-child(6){left:124px;top:106px}
.bg-blossom span:nth-child(7){left:218px;top:82px}
.bg-moon{
  right:70px;
  top:82px;
  width:150px;
  height:150px;
  border-radius:50%;
  background: rgba(255,250,238,.55);
  box-shadow:0 0 40px rgba(255,210,225,.45);
  opacity: .75;
}
.bg-moon::after{
  content:"";
  position:absolute;
  right:28px;
  top:8px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(255,221,234,.72);
}
.bg-window{
  left:50%;
  bottom:38px;
  width:360px;
  height:180px;
  transform: translateX(-50%);
  opacity:.16;
  border:3px solid rgba(160,78,110,.55);
  border-radius:180px 180px 12px 12px;
  background:
    linear-gradient(90deg, transparent 48%, rgba(160,78,110,.55) 49%, rgba(160,78,110,.55) 51%, transparent 52%),
    linear-gradient(transparent 48%, rgba(160,78,110,.45) 49%, rgba(160,78,110,.45) 51%, transparent 52%);
}
.bg-ribbon{
  left:38px;
  bottom:88px;
  width:130px;
  height:80px;
  opacity:.58;
  transform:rotate(-18deg);
}
.bg-ribbon::before,
.bg-ribbon::after{
  content:"";
  position:absolute;
  top:12px;
  width:58px;
  height:54px;
  background:rgba(255,178,205,.62);
  border:1px solid rgba(180,88,120,.16);
}
.bg-ribbon::before{
  left:0;
  border-radius:70% 35% 70% 35%;
}
.bg-ribbon::after{
  right:0;
  border-radius:35% 70% 35% 70%;
}
.bg-ribbon span{
  position:absolute;
  left:54px;
  top:28px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(255,245,248,.75);
}
.bg-fan{
  right:-92px;
  bottom:-96px;
  width:390px;
  height:390px;
  border-radius:50%;
  opacity:.82;
  background:
    radial-gradient(circle, transparent 57%, rgba(178,86,120,.13) 59%, transparent 61%);
}
.bg-fan::before{
  content:"";
  position:absolute;
  inset:34px;
  border-radius:50%;
  border:1px solid rgba(178,86,120,.14);
}
.bg-fan::after{
  content:"";
  position:absolute;
  inset:70px;
  border-radius:50%;
  border:1px solid rgba(178,86,120,.10);
}
body::before,
body::after{
  content:none !important;
}
</style>
</head>
<body>

<!-- 背景元素 -->
<div class="bg-art"></div>
<div class="bg-clouds"></div>
<div class="bg-blossom">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>
<div class="bg-moon"></div>
<div class="bg-window"></div>
<div class="bg-ribbon"><span></span></div>
<div class="bg-fan"></div>

<!-- 原本內容不動 -->
<div class="float-layer" id="floatLayer"></div>
<main class="wrap">
<section class="hero">
<span class="eyebrow"> ♫</span>
<h1>念念の歌單</h1>
<p>公主城堡歡迎你。</p>
<div class="controls">
<input class="search" id="search" placeholder="搜尋歌名、歌手或分類…"/>
<button class="random" id="randomBtn" type="button">🎲 隨機抽歌</button>
</div>
<div class="tags" id="tags"></div>
<div class="meta"><span id="count">讀取中…</span><span class="status" id="status"></span></div>
</section>
<section class="grid" id="grid"></section>
<div class="empty" id="empty">沒有找到符合條件的歌曲</div>
</main>
<div class="modal" id="modal"><div class="modal-card"><h2>🍓念念推薦</h2><div class="big" id="pickSong"></div><div id="pickArtist"></div><button class="close" id="closeModal" type="button">謝謝尼的歌單啊！</button></div></div>

<script src="./script.js?v=1001"></script>
</body>
</html>
