<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>念念的歌單</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --pink-900:#8a3f5b; --pink-800:#a94f70; --pink-700:#d96b93; --pink-600:#ff8fb1;
  --pink-300:#ffd1df; --pink-200:#ffe1ea; --pink-100:#fff3f7;
  --cream:#fff8f4; --ink:#5a2f40; --muted:#9a6377; --white:rgba(255,255,255,.82);
  --shadow:0 18px 45px rgba(217,107,147,.18); --radius:26px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:'Zen Maru Gothic','Noto Serif TC',system-ui,sans-serif;
  overflow-x:hidden;
  position: relative;
  background:
    radial-gradient(circle at 12% 10%, rgba(255,209,223,.95), transparent 34%),
    radial-gradient(circle at 85% 15%, rgba(255,225,234,.9), transparent 28%),
    linear-gradient(135deg,#fff3f7 0%,#ffe1ea 48%,#fff8f4 100%),
    radial-gradient(circle at 50% 80%, rgba(255,239,244,.2), transparent 50%);
}
body:before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.32) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.26) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 84%);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    url('./草莓凱蒂貓.jpg') no-repeat left bottom 8% 15% / 120px auto,
    url('./帽子凱蒂貓jpg.jpg') no-repeat right top 12% 10% / 100px auto,
    url('https://i.ibb.co/5xq5tGh/chinese-floral.png') repeat;
  opacity: 0.08;
  filter: blur(2px);
}
.float-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float{
  position:absolute;bottom:-8vh;font-size:clamp(18px,2.6vw,32px);opacity:.42;
  filter:drop-shadow(0 8px 12px rgba(217,107,147,.15));
  animation:rise var(--dur) linear infinite;left:var(--left);animation-delay:var(--delay)
}
@keyframes rise{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  15%{opacity:.45}
  100%{transform:translateY(-112vh) rotate(360deg);opacity:0}
}
/* 以下保持你原本 CSS 完整不動 */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:42px 20px 70px}
.hero{padding:34px;border-radius:36px;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,243,247,.66));box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px);text-align:center !important;display:flex !important;flex-direction:column !important;align-items:center !important}
.eyebrow{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;background:rgba(255,143,177,.16);color:var(--pink-800); font-weight:700;letter-spacing:.08em;margin:0 auto;text-align:center !important;}
.hero h1{font-family:'Noto Serif TC',serif;font-size:clamp(36px,6vw,68px);line-height:1.1;margin:20px 0 12px;color:var(--pink-900);letter-spacing:.06em;text-align:center !important;width:100%}
.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.9;text-align:center !important;width:100%}
.controls{display:grid;grid-template-columns:1fr auto;gap:16px;margin:26px 0 18px;width:100%}
.search{width:100%;border:0;outline:0;border-radius:999px;background:rgba(255,255,255,.9);padding:16px 20px;font-size:16px;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(217,107,147,.18),0 10px 22px rgba(217,107,147,.08)}
.random{border:0;border-radius:999px;padding:0 22px;background:linear-gradient(135deg,#ff7aa2,#ffb3c7);color:white;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 14px 30px rgba(217,107,147,.25);transition:.22s}.random:hover{transform:translateY(-2px)}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 26px;width:100%}.tag{--tag:#ff8fb1;--tagLight:#fff3f7;border:1px solid rgba(217,107,147,.14);background:linear-gradient(135deg,rgba(255,255,255,.88),var(--tagLight));color:#a94f70;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 9px 18px rgba(217,107,147,.08);transition:.22s}.tag:hover{transform:translateY(-2px);box-shadow:0 13px 26px rgba(217,107,147,.14)}.tag.active{background:linear-gradient(135deg,var(--tag),#d96b93);color:white;border-color:transparent;box-shadow:0 15px 28px rgba(217,107,147,.25);transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{position:relative;min-height:150px;padding:22px 18px 56px;border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,243,247,.76));border:1px solid rgba(255,255,255,.82);box-shadow:0 15px 32px rgba(217,107,147,.12);overflow:hidden;transition:.22s}.card:hover{transform:translateY(-4px)}.card:after{content:'♪';position:absolute;right:18px;top:12px;font-size:48px;color:rgba(217,107,147,.12);font-family:serif}.song{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700;color:var(--pink-900);margin:0 0 9px}.artist{font-size:15px;color:var(--muted);font-weight:700;margin-bottom:12px}.cat{display:inline-flex;max-width:100%;padding:6px 11px;border-radius:999px;background:rgba(255,143,177,.15);color:#a94f70;font-size:13px;font-weight:700;line-height:1.5}.copy{position:absolute;right:14px;bottom:14px;border:0;border-radius:999px;padding:8px 13px;background:#ffe1ea;color:#a94f70;font-weight:800;cursor:pointer;transition:.2s}.copy:hover{background:#ffd1df}.copy.done{background:#ff8fb1;color:white}.empty{display:none;text-align:center;padding:44px;border-radius:26px;background:rgba(255,255,255,.72);color:#9a6377;font-weight:700}.picked{animation:pulse 1.4s ease 1;box-shadow:0 0 0 4px rgba(255,143,177,.18),0 18px 45px rgba(217,107,147,.2)}@keyframes pulse{0%,100%{transform:scale(1)}35%{transform:scale(1.035)}}
.modal{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:rgba(90,47,64,.28);backdrop-filter:blur(6px);padding:18px}.modal.show{display:grid}.modal-card{max-width:420px;width:100%;background:linear-gradient(135deg,#fff,#fff3f7);border-radius:30px;padding:30px;box-shadow:0 30px 70px rgba(90,47,64,.28);text-align:center}.modal h2{font-family:'Noto Serif TC',serif;margin:0 0 12px;color:#8a3f5b}.modal .big{font-size:30px;font-family:'Noto Serif TC',serif;font-weight:700;margin:12px 0;color:#8a3f5b}.close{margin-top:16px;border:0;border-radius:999px;background:#ff8fb1;color:white;padding:11px 20px;font-weight:800;cursor:pointer}
@media(max-width:680px){.wrap{padding:24px 14px 50px}.hero{padding:24px 18px;border-radius:28px}.controls{grid-template-columns:1fr}.random{height:50px}.grid{grid-template-columns:1fr}.tag{padding:10px 13px}}
</style>
</head>
<body>
<div class="float-layer" id="floatLayer"></div>
<main class="wrap">
  <section class="hero">
    <span class="eyebrow"> ♫</span>
    <h1>念念の歌單</h1>
    <p>公主城堡歡迎你。</p>
    <div class="controls">
      <input class="search" id="search" placeholder="搜尋歌名、歌手或分類…"/>
      <button class="random" id="randomBtn" type="button">🎲 隨機抽歌</button>
    </div>
    <div class="tags" id="tags"></div>
    <div class="meta"><span id="count">讀取中…</span><span class="status" id="status"></span></div>
  </section>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty">沒有找到符合條件的歌曲</div>
</main>
<div class="modal" id="modal">
  <div class="modal-card">
    <h2>🌻 念念推薦</h2>
    <div class="big" id="pickSong"></div>
    <div id="pickArtist"></div>
    <button class="close" id="closeModal" type="button">賓果！</button>
  </div>
</div>

<script>
// 動態生成漂浮少女元素
const floatLayer = document.getElementById('floatLayer');
const emojis = ['❤️','⭐','🌸'];
for(let i=0;i<35;i++){
  const span = document.createElement('span');
  span.className='float';
  span.style.setProperty('--dur',`${5+Math.random()*12}s`);
  span.style.setProperty('--left',`${Math.random()*100}%`);
  span.style.setProperty('--delay',`${Math.random()*5}s`);
  span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  floatLayer.appendChild(span);
}
</script>

<script src="./script.js?v=1001"></script>
</body>
</html>
